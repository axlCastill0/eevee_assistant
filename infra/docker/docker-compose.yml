services:
  backend:
    build:
      # Context is repo root so the Dockerfile can copy apps/backend/
      context: ../..
      dockerfile: infra/docker/backend/Dockerfile
    restart: always
    network_mode: host

    # Logs are capped. This box is meant to run for months unattended, and the
    # json-file driver defaults to UNLIMITED -- a restart-looping container
    # (which is exactly what a crash at startup produces) can fill the SD card
    # with its own traceback, taking the whole system down with it. Seen the
    # near-miss on 2026-10-19: the voice container looped for days.
    #
    # 10 MB x 3 is a few days of normal output and bounds the worst case at
    # 30 MB per service.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    volumes:
      # HOST TIMEZONE. Without this the container runs on UTC no matter what
      # the Pi is set to, and everything the backend computes from the local
      # clock is wrong by the offset: the spoken time, a timer's "ends at",
      # and — the one that actually hurts — the weekly alarms, which would
      # fire at 7:30 UTC instead of 7:30 your time.
      #
      # A read-only mount rather than a TZ env var: glibc reads
      # /etc/localtime directly, so this works without tzdata being installed
      # in the image, and it follows the host if the zone is ever changed.
      # Containers must be recreated (not just restarted) to pick up a change.
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro

      # Writable state, as opposed to the read-only mounts. Holds the Spotify
      # refresh token (which is why the Pi stays connected across restarts),
      # the weekly alarms and the dashboard settings. Written atomically; see
      # spotify.py, alarms.py and settings.py.
      - ../../state:/app/state

      # Alarm and timer sounds. Read-only: the backend serves these files and
      # never writes them, and "upload" here is `scp` or a USB stick, which
      # needs no endpoint to defend. Drop .mp3 files in and they appear in the
      # Settings dropdown with no rebuild and no restart.
      - ../../media:/app/media:ro

    env_file:
      - path: .env
        required: false

  voice:
    build:
      context: ../..
      dockerfile: infra/docker/voice/Dockerfile
      args:
        # Must match `getent group audio` on the Pi, or /dev/snd is unreadable.
        AUDIO_GID: "${AUDIO_GID:-29}"

    # Deliberately NOT `depends_on: backend`. The two services are independent:
    # the API must survive a broken pipeline, and the pipeline boots and reports
    # the outage out loud when the API is down. Adding depends_on here would
    # couple their lifecycles back together.

    # `unless-stopped` rather than `always`, unlike the backend: a missing model
    # file makes this exit non-zero, and `always` would restart-loop it
    # indefinitely. This way `docker compose stop voice` sticks while debugging.
    restart: unless-stopped

    # Logs are capped. This box is meant to run for months unattended, and the
    # json-file driver defaults to UNLIMITED -- a restart-looping container
    # (which is exactly what a crash at startup produces) can fill the SD card
    # with its own traceback, taking the whole system down with it. Seen the
    # near-miss on 2026-10-19: the voice container looped for days.
    #
    # 10 MB x 3 is a few days of normal output and bounds the worst case at
    # 30 MB per service.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    # Host networking so the pipeline reaches the API on 127.0.0.1:8000, and
    # because it is the project-wide convention on this Pi.
    network_mode: host

    # ALSA access for the USB mic and speaker.
    devices:
      - /dev/snd:/dev/snd

    volumes:
      # Host timezone, same as the backend. Nothing the pipeline SAYS is
      # computed from the clock (the backend words every answer), but its log
      # timestamps are, and logs that disagree with the host's by eight hours
      # make correlating a failure needlessly hard.
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro

      # Large models live outside the image: Qwen2.5-1.5B-Q5 (~1.2 GB), the
      # Piper voice and the Silero VAD. Read-only — the pipeline never writes
      # here. Populate with scripts/fetch-voice-models.sh.
      - ../../models:/app/models:ro

    env_file:
      - path: .env
        required: false

    # Qwen2.5-1.5B-Q5 is ~1.2 GB resident, plus Whisper and Piper. The cap is
    # a guard against a leak taking the whole Pi down with the API on it;
    # raise it if you move to a larger model.
    mem_limit: 2560m

  ui:
    build:
      context: ../..
      dockerfile: infra/docker/ui/Dockerfile

    # Like voice, NOT `depends_on: backend`. The dashboard's job includes
    # reporting that the backend is down, which it cannot do if Docker refuses
    # to start it first.
    restart: always

    network_mode: host

    # Logs are capped. This box is meant to run for months unattended, and the
    # json-file driver defaults to UNLIMITED -- a restart-looping container
    # (which is exactly what a crash at startup produces) can fill the SD card
    # with its own traceback, taking the whole system down with it. Seen the
    # near-miss on 2026-10-19: the voice container looped for days.
    #
    # 10 MB x 3 is a few days of normal output and bounds the worst case at
    # 30 MB per service.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    environment:
      # nginx attaches this to every proxied request. It is never served to
      # the browser — see infra/docker/ui/nginx.conf.template.
      API_KEY: "${API_KEY:?API_KEY must be set in infra/docker/.env}"
      BACKEND_ORIGIN: "${BACKEND_ORIGIN:-http://127.0.0.1:8000}"

    # Static files and a proxy. The default nginx worker footprint is already
    # larger than this needs.
    mem_limit: 128m
